<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل بیمار</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">پنل کاربری من 👤</h2>
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                نوبت‌های من
            </div>
            <div class="card-body">
                <table class="table table-striped text-center">
                    <thead>
                        <tr>
                            <th>پزشک</th>
                            <th>تاریخ</th>
                            <th>ساعت</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for app in appointments %}
                        <tr>
                            <td>دکتر {{ app.doctor.first_name }} {{ app.doctor.last_name }}</td>
                            <td>{{ app.date }}</td>
                            <td>{{ app.time }}</td>
                            <td>
                                {% if app.is_active %}
                                    <span class="badge bg-success">فعال</span>
                                {% else %}
                                    <span class="badge bg-danger">لغو شده</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-muted">شما هیچ نوبتی ندارید.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
