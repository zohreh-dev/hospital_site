<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سایت</title>
    
    <!-- لینک‌های بوت‌استرپ و فونت -->
    <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css">
    <link rel="stylesheet" href="https://cdn.uitool.ir/bootstrap/5.3.0/css/bootstrap.rtl.min.css">
    
    <style>
        /* استایل‌های پشتیبان (اگر اینترنت بوت‌استرپ رو لود نکرد، اینا کار می‌کنن) */
        body {
            font-family: Tahoma, 'Vazir', sans-serif;
            background-color: #f0f2f5;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-header {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 10px 10px 0 0;
            margin: -30px -30px 20px -30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-success {
            background-color: #198754;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6c757d;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card shadow">
        <div class="login-header">
            <h4 class="mb-0">ورود به حساب کاربری 🏥</h4>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <!-- کادرهای دستی با کلاس‌های بوت‌استرپ -->
            <div class="form-group">
                <label for="id_username">نام کاربری:</label>
                <input type="text" name="username" id="id_username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="id_password">رمز عبور:</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">ورود</button>
            <a href="/" class="btn-link">بازگشت به خانه</a>
        </form>
    </div>

</body>
</html>
