{% extends 'base.html' %}

{% block title %}ورود به حساب کاربری{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0" style="border-radius: 15px;">
            <div class="card-header bg-primary text-white text-center py-3" style="border-radius: 15px 15px 0 0;">
                <h4 class="mb-0 fw-bold">ورود به حساب کاربری 🏥</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">نام کاربری:</label>
                        <input type="text" name="username" id="id_username" class="form-control form-control-lg" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-bold">رمز عبور:</label>
                        <input type="password" name="password" id="id_password" class="form-control form-control-lg" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg" style="border-radius: 10px;">ورود</button>
                        <a href="/" class="btn btn-outline-secondary" style="border-radius: 10px;">بازگشت به خانه</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
