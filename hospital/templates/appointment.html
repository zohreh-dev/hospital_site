<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو نوبت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <!-- منوی بالای سایت -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">🏥 بیمارستان من</a>
        </div>
    </nav>

    <!-- فرم رزرو نوبت -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">فرم رزرو نوبت</h3>
                    </div>
                    <div class="card-body p-4">
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            <!-- اینجا جنگو خودش کادرهای فرم رو می‌سازه -->
                            {{ form.as_p }}
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg">ثبت نوبت</button>
                                <a href="/" class="btn btn-outline-secondary">بازگشت به خانه</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
