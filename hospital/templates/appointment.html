{% extends 'base.html' %}

{% block title %}رزرو نوبت{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-lg border-0" style="border-radius: 15px;">
            <div class="card-header bg-primary text-white text-center py-3" style="border-radius: 15px 15px 0 0;">
                <h3 class="mb-0 fw-bold">فرم رزرو نوبت 🗓️</h3>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- استایل‌دهی به فیلدهای جنگو -->
                    <style>
                        form p { margin-bottom: 15px; }
                        form label { font-weight: bold; margin-bottom: 5px; display: block; }
                        form input, form select { 
                            width: 100%; 
                            padding: 10px; 
                            border: 1px solid #ced4da; 
                            border-radius: 8px; 
                        }
                    </style>

                    {{ form.as_p }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg" style="border-radius: 10px;">ثبت نوبت</button>
                        <a href="/" class="btn btn-outline-secondary" style="border-radius: 10px;">بازگشت به خانه</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
