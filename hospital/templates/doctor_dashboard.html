<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل پزشک</title>
    <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css">
    <link rel="stylesheet" href="https://cdn.uitool.ir/bootstrap/5.3.0/css/bootstrap.rtl.min.css">
    <style>
        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4 text-primary">پنل پزشک 🩺</h2>
        
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">نوبت‌های من</h4>
            </div>
            <div class="card-body">
                <table class="table table-striped text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>بیمار</th>
                            <th>تاریخ</th>
                            <th>ساعت</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for app in appointments %}
                        <tr>
                            <td>{{ app.patient.first_name }} {{ app.patient.last_name }}</td>
                            <td>{{ app.date }}</td>
                            <td>{{ app.time }}</td>
                            <td>
                                {% if app.is_active %}
                                    <span class="badge bg-success">فعال</span>
                                {% else %}
                                    <span class="badge bg-danger">لغو شده</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-muted p-4">شما هیچ نوبتی ندارید.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-4 text-center">
            <a href="/" class="btn btn-outline-secondary">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
